<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1fd0" />
      <stop offset="0.7" stop-color="#1a1578" />
      <stop offset="1" stop-color="#0c0b3e" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.3" stop-color="#fff" />
      <stop offset="0.7" stop-color="#fff" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" /></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- faint background squares -->
  <g fill="#fff" opacity="0.06">
    <rect x="24" y="40" width="120" height="120" />
    <rect x="300" y="18" width="140" height="140" />
    <rect x="170" y="150" width="110" height="110" />
  </g>
  <!-- ground -->
  <rect y="392" width="512" height="120" fill="#120f5a" />
  <rect x="0" y="420" width="90" height="70" fill="#fff" opacity="0.05" />
  <rect x="180" y="420" width="90" height="70" fill="#fff" opacity="0.05" />
  <rect x="360" y="420" width="90" height="70" fill="#fff" opacity="0.05" />
  <rect y="388" width="512" height="8" fill="url(#line)" />
  <!-- the arc of the jump -->
  <path d="M60 372 Q 190 90 330 250" fill="none" stroke="#3ae8ff" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.8" />
  <!-- spikes -->
  <g stroke="#e6ecff" stroke-width="7" stroke-linejoin="round" fill="#05051c">
    <path d="M262 390 L302 314 L342 390 Z" />
    <path d="M342 390 L382 314 L422 390 Z" />
  </g>
  <!-- the cube, mid-jump -->
  <g transform="translate(206 176) rotate(-22)">
    <rect x="-86" y="-86" width="172" height="172" rx="10" fill="#ff4fd8" filter="url(#glow)" opacity="0.65" />
    <rect x="-80" y="-80" width="160" height="160" rx="8" fill="#ff4fd8" stroke="#000" stroke-width="12" />
    <ellipse cx="-30" cy="-18" rx="16" ry="28" fill="#3ae8ff" stroke="#000" stroke-width="7" />
    <ellipse cx="30" cy="-18" rx="16" ry="28" fill="#3ae8ff" stroke="#000" stroke-width="7" />
    <path d="M-44 30 Q 0 66 44 30" fill="none" stroke="#3ae8ff" stroke-width="13" stroke-linecap="round" />
  </g>
</svg>
