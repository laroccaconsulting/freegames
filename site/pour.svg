<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="100%" r="100%">
      <stop offset="0" stop-color="#4a1277" />
      <stop offset="0.6" stop-color="#150834" />
      <stop offset="1" stop-color="#08031c" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5fd2" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ff5fd2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.3" />
      <stop offset="0.22" stop-color="#fff" stop-opacity="0.5" />
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.05" />
      <stop offset="1" stop-color="#000" stop-opacity="0.3" />
    </linearGradient>
    <clipPath id="t1"><path d="M-44 0v196a44 44 0 0 0 88 0V0z" /></clipPath>
    <clipPath id="t2"><path d="M-44 0v196a44 44 0 0 0 88 0V0z" /></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <circle cx="330" cy="330" r="190" fill="url(#glow)" />
  <!-- receiving tube -->
  <g transform="translate(330 196)">
    <g clip-path="url(#t2)">
      <rect x="-50" y="170" width="100" height="80" fill="#29e6ff" />
      <rect x="-50" y="100" width="100" height="70" fill="#ff3860" />
      <rect x="-50" y="100" width="100" height="6" fill="#fff" opacity="0.4" />
      <rect x="-50" y="-10" width="100" height="260" fill="url(#shine)" />
    </g>
    <path d="M-44 0v196a44 44 0 0 0 88 0V0" fill="none" stroke="#e6dcff" stroke-width="8" />
    <rect x="-56" y="-8" width="112" height="14" rx="7" fill="#fff" />
  </g>
  <!-- stream -->
  <path d="M312 118 Q316 200 318 292" stroke="#ff3860" stroke-width="18" stroke-linecap="round" fill="none" />
  <!-- pouring tube, tipped -->
  <g transform="translate(300 112) rotate(62) translate(-44 0)">
    <g clip-path="url(#t1)">
      <polygon points="-60,40 80,-34 80,260 -60,260" fill="#ff3860" />
      <rect x="-50" y="-10" width="100" height="260" fill="url(#shine)" />
    </g>
    <path d="M-44 0v196a44 44 0 0 0 88 0V0" fill="none" stroke="#e6dcff" stroke-width="8" />
    <rect x="-56" y="-8" width="112" height="14" rx="7" fill="#fff" />
  </g>
</svg>
