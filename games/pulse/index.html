<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Pulse — one-tap rhythm platformer, free, no ads</title>
    <meta name="description" content="Jump, fly and flip through neon levels to a synthesized beat. Practice mode, a daily level, endless generated levels, and every one proven beatable. Free forever, no ads, no tracking, works offline." />
    <meta name="theme-color" content="#101238" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Pulse — one-tap rhythm platformer, no ads" />
    <meta property="og:description" content="Tap to jump, hold to fly. Neon levels, a daily challenge and a practice mode. No ads, no tracking, works offline." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="core/base.css" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body class="in-menu">
    <canvas id="canvas" aria-hidden="true"></canvas>
    <div id="input" class="input-layer" aria-hidden="true"></div>

    <!-- In-game heads-up display -->
    <div class="hud" id="hud">
      <button class="hud-btn" id="pause-btn" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2" /><rect x="13.9" y="5" width="3.6" height="14" rx="1.2" /></svg>
      </button>
      <div class="progress" id="progress" aria-hidden="true">
        <div class="bar"><i id="progress-fill"></i><i class="best" id="progress-best"></i></div>
        <b id="pct">0%</b>
      </div>
      <div class="practice-tools" id="practice-tools" hidden>
        <button class="hud-btn big" id="cp-add" aria-label="Place a checkpoint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l6 9-6 9-6-9z" /></svg>
        </button>
        <button class="hud-btn big" id="cp-del" aria-label="Remove the last checkpoint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l6 9-6 9-6-9z" /><path d="M4 4l16 16" /></svg>
        </button>
      </div>
      <div class="banner" id="banner" hidden></div>
    </div>

    <!-- Main menu -->
    <div class="menu" id="menu">
      <header class="topbar">
        <h1 class="logo" aria-label="Pulse"><span>P</span><span>U</span><span>L</span><span>S</span><span>E</span></h1>
        <button class="icon-btn" id="settings-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2.2" /><circle cx="9" cy="17" r="2.2" /></svg>
        </button>
      </header>
      <div class="cards-wrap">
        <button class="nav prev" id="prev" aria-label="Previous level"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
        <div class="cards" id="cards" role="list"></div>
        <button class="nav next" id="next" aria-label="Next level"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
      </div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <nav class="menu-bar">
        <button class="pill" id="icons-btn"><canvas id="icon-preview" width="44" height="44" aria-hidden="true"></canvas><span>Icon</span></button>
        <button class="pill" id="stats-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16" /><rect x="5.5" y="12" width="3" height="5.5" rx="1" /><rect x="10.5" y="7" width="3" height="10.5" rx="1" /><rect x="15.5" y="10" width="3" height="7.5" rx="1" /></svg><span>Stats</span></button>
        <button class="pill" id="help-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.5" /><circle cx="12" cy="16.8" r="1" fill="currentColor" stroke="none" /></svg><span>How to play</span></button>
      </nav>
    </div>

    <p class="visually-hidden" id="announce" aria-live="polite"></p>
    <noscript><p style="padding: 24px; color: #fff">Pulse needs JavaScript to run.</p></noscript>
  </body>
</html>
