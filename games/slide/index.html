<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slide — sliding block puzzles, free, no ads</title>
    <meta name="description" content="Sliding block puzzles with a par for every board. Unblock the key block, or put the numbered tiles in order. A new daily puzzle, endless levels, no ads, works offline." />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Slide" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:title" content="Slide — sliding block puzzles, no ads" />
    <meta property="og:description" content="Unblock the key or order the tiles in as few moves as par. Daily puzzle, share your score." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="core/base.css" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="title-btn" id="mode-btn" aria-label="Choose puzzle">
          <span class="title-main" id="title">Slide</span>
          <small class="title-sub" id="subtitle"></small>
        </button>
        <div class="score" aria-live="off">
          <div class="chip"><small>Moves</small><b id="moves">0</b></div>
          <div class="chip chip-par"><small>Par</small><b id="par">–</b></div>
        </div>
      </header>

      <div class="challenge" id="challenge" hidden></div>
      <p class="status" id="status"></p>

      <main class="stage" id="stage" aria-label="Puzzle">
        <div class="board-host" id="board"></div>
        <div class="mixing" id="mixing" hidden>
          <span class="mixing-dots"><i></i><i></i><i></i></span>
          Building a puzzle…
        </div>
      </main>

      <nav class="toolbar" aria-label="Game controls">
        <button class="tool" id="restart-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6" /><path d="M4 4v4h4" /></svg>
          <span>Restart</span>
        </button>
        <button class="tool" id="undo-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          <span>Undo</span>
        </button>
        <button class="tool" id="hint-btn"><span>Hint</span></button>
        <button class="tool" id="menu-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          <span>Menu</span>
        </button>
      </nav>
    </div>
    <p class="visually-hidden" id="announce" aria-live="polite"></p>
    <noscript><p style="padding: 24px">Slide needs JavaScript to run.</p></noscript>
  </body>
</html>
