<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="100%" r="100%">
      <stop offset="0" stop-color="#4a1277" />
      <stop offset="0.6" stop-color="#150834" />
      <stop offset="1" stop-color="#08031c" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16" /></filter>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8ab4" /><stop offset="1" stop-color="#d4145a" /></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ff2ff" /><stop offset="1" stop-color="#0fa3d6" /></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff08a" /><stop offset="1" stop-color="#f29a0a" /></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8ff9a" /><stop offset="1" stop-color="#14b86a" /></linearGradient>
    <symbol id="b" viewBox="0 0 100 100">
      <rect x="4" y="4" width="92" height="92" rx="18" fill="currentColor" />
      <rect x="4" y="4" width="92" height="92" rx="18" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="7" />
      <rect x="18" y="12" width="64" height="18" rx="9" fill="#fff" opacity="0.6" />
    </symbol>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <g filter="url(#glow)" opacity="0.7">
    <rect x="96" y="96" width="320" height="320" rx="40" fill="#ff2fb0" />
  </g>
  <!-- a 4×4 board with an L piece dropping in to clear a row -->
  <rect x="86" y="86" width="340" height="340" rx="42" fill="#12072e" stroke="#c9b6ff" stroke-opacity="0.5" stroke-width="6" />
  <g>
    <use href="#b" x="100" y="100" width="78" height="78" style="color:#3a6bff" />
    <use href="#b" x="100" y="178" width="78" height="78" style="color:#29e6ff" />
    <use href="#b" x="178" y="178" width="78" height="78" style="color:#29e6ff" />
    <use href="#b" x="100" y="256" width="78" height="78" style="color:#ffb020" />
    <use href="#b" x="178" y="256" width="78" height="78" style="color:#ffb020" />
    <use href="#b" x="334" y="256" width="78" height="78" style="color:#ffb020" />
    <use href="#b" x="100" y="334" width="78" height="78" style="color:#a45bff" />
    <use href="#b" x="334" y="334" width="78" height="78" style="color:#3dff8f" />
    <use href="#b" x="256" y="334" width="78" height="78" style="color:#3dff8f" />
  </g>
  <!-- the gap about to be filled glows -->
  <rect x="258" y="258" width="74" height="74" rx="16" fill="#fff27a" opacity="0.9" />
  <use href="#b" x="256" y="100" width="78" height="78" style="color:#ff3d7f" />
  <use href="#b" x="334" y="100" width="78" height="78" style="color:#ff3d7f" />
  <use href="#b" x="334" y="178" width="78" height="78" style="color:#ff3d7f" />
</svg>
