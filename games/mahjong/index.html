<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mahjong Solitaire — every deal winnable, free, no ads</title>
    <meta name="description" content="Mahjong solitaire where every deal can be won. Classic Turtle, Pyramid and Quick layouts, clear tiles with big numbers, hints, winnable shuffles and a daily deal. Free, no ads, works offline." />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mahjong" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="core/base.css" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="title-btn" id="mode-btn" aria-label="Choose layout">
          <span class="title-main" id="title">Mahjong</span>
          <small class="title-sub" id="subtitle"></small>
        </button>
        <div class="score">
          <div class="chip"><small>Tiles</small><b id="left">0</b></div>
          <div class="chip"><small>Pairs</small><b id="pairs">0</b></div>
        </div>
      </header>
      <main class="stage" id="stage" aria-label="Tiles"></main>
      <nav class="toolbar" aria-label="Game controls">
        <button class="tool" id="undo-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          <span>Undo</span>
        </button>
        <button class="tool" id="hint-btn"><span>Hint</span></button>
        <button class="tool" id="shuffle-btn"><span>Shuffle</span></button>
        <button class="tool" id="menu-btn"><span>Menu</span></button>
      </nav>
    </div>
    <p class="visually-hidden" id="announce" aria-live="polite"></p>
    <noscript><p style="padding: 24px">Mahjong needs JavaScript to run.</p></noscript>
  </body>
</html>
