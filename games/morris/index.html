<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nine Men's Morris — free, no ads, works offline</title>
    <meta name="description" content="The ancient mill game: place nine pieces, move them along the lines, and make rows of three to take your opponent's pieces. Play the computer or a friend. Free, no ads, works offline." />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Morris" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="core/base.css" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="title-btn" id="mode-btn" aria-label="Choose opponent">
          <span class="title-main">Morris</span>
          <small class="title-sub" id="subtitle"></small>
        </button>
        <div class="score" aria-live="polite">
          <div class="chip p1" id="chip1"><small><i></i><span id="name1">You</span></small><b id="score1">9</b></div>
          <div class="chip p2" id="chip2"><small><i></i><span id="name2">CPU</span></small><b id="score2">9</b></div>
        </div>
      </header>
      <p class="status" id="status" aria-live="polite"></p>
      <main class="stage" id="stage" aria-label="Board"></main>
      <nav class="toolbar" aria-label="Game controls">
        <button class="tool" id="undo-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          <span>Undo</span>
        </button>
        <button class="tool" id="new-btn"><span>New game</span></button>
        <button class="tool" id="menu-btn"><span>Menu</span></button>
      </nav>
    </div>
    <noscript><p style="padding: 24px">Nine Men's Morris needs JavaScript to run.</p></noscript>
  </body>
</html>
