<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fleet — find and sink the hidden ships, free, no ads</title>
    <meta name="description" content="Find and sink the hidden fleet. Battle a sharp computer, or play the daily solo sea and sink every ship in fewer shots than par. Free, no ads, works offline." />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Fleet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="core/base.css" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="title-btn" id="mode-btn" aria-label="Choose game">
          <span class="title-main" id="title">Fleet</span>
          <small class="title-sub" id="subtitle"></small>
        </button>
        <div class="score" id="score"></div>
      </header>
      <p class="status" id="status" aria-live="off"></p>
      <main class="stage" id="stage"></main>
      <nav class="toolbar" aria-label="Game controls">
        <button class="tool" id="hint-btn"><span>Hint</span></button>
        <button class="tool" id="new-btn"><span>New</span></button>
        <button class="tool" id="menu-btn"><span>Menu</span></button>
      </nav>
    </div>
    <p class="visually-hidden" id="announce" aria-live="polite"></p>
    <noscript><p style="padding: 24px">Fleet needs JavaScript to run.</p></noscript>
  </body>
</html>
