<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Wand — trace a spell, cast it. Free, no ads</title>
    <meta name="description" content="Hold the wand, trace a shape in the air and the spell fires. Eighteen glyphs: pull, push, lift, light, burn, freeze, unlock, mend. A first-person spellcasting sandbox. Free forever, no ads, no tracking, works offline." />
    <meta name="theme-color" content="#120c22" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wand" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Wand — trace a spell, cast it" />
    <meta property="og:description" content="Draw the shape, the spell fires. Eighteen glyphs in a first-person chamber. No ads, no tracking, works offline." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="core/base.css" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <canvas id="canvas" aria-hidden="true"></canvas>

    <header class="hud-top topbar">
      <button class="hud-btn" id="places-btn" aria-label="Places">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5L3.5 6.8v12.7L9 17.2l6 2.3 5.5-2.3V4.5L15 6.8z" /><path d="M9 4.5v12.7M15 6.8v12.7" /></svg>
        <span>Places</span>
      </button>
      <button class="hud-btn" id="book-btn" aria-label="Spellbook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.2A2.2 2.2 0 0 1 6.2 3H19v15H6.2A2.2 2.2 0 0 0 4 20.2z" /><path d="M4 20.2A2.2 2.2 0 0 1 6.2 18H19v3H6.2A2.2 2.2 0 0 1 4 20.2z" /><path d="M8.5 7.5h6M8.5 11h4" /></svg>
        <span>Spells</span>
      </button>
      <button class="hud-btn" id="steps-btn" aria-label="Steps">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5l1.8 1.8L9 5M4 13l1.8 1.8L9 11.5M4 19.5l1.8 1.8L9 18M12 7h8M12 13.5h8M12 20h8" /></svg>
        <span><b id="steps-count">0</b>/<b id="steps-total">10</b></span>
      </button>
      <h1 class="visually-hidden">Wand</h1>
      <span class="spacer"></span>
      <button class="hud-btn" id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2.2" /><circle cx="9" cy="17" r="2.2" /></svg>
      </button>
    </header>

    <p class="place-name" id="place-name" aria-hidden="true"></p>

    <!-- What just happened -->
    <div class="readout" id="readout" aria-hidden="true">
      <b id="spell-name"></b>
      <span id="spell-msg"></span>
    </div>

    <!-- The steps of the place you are in, slides up from the bottom -->
    <section class="drawer" id="steps-drawer" hidden aria-label="Steps">
      <h2 id="steps-title">Steps</h2>
      <ul id="step-list"></ul>
      <p class="muted small" id="steps-note"></p>
      <button class="btn" id="steps-close">Close</button>
    </section>

    <!-- Where you can go -->
    <section class="panel places" id="places" hidden aria-label="Places">
      <div class="panel-inner">
        <header>
          <h2>Places</h2>
          <p class="muted small" id="places-known"></p>
        </header>
        <div class="place-list" id="place-list"></div>
        <button class="btn btn-primary" id="places-close">Back to the wand</button>
      </div>
    </section>

    <!-- Finished a place -->
    <section class="panel victory" id="victory" hidden aria-label="Finished">
      <div class="panel-inner">
        <p class="eyebrow">Finished</p>
        <h2 id="victory-name"></h2>
        <p id="victory-line"></p>
        <p class="unlocked" id="victory-unlocked"></p>
        <div class="row">
          <button class="btn" id="victory-stay">Stay a while</button>
          <button class="btn btn-primary" id="victory-next">Next</button>
        </div>
      </div>
    </section>

    <p class="hint" id="hint" aria-hidden="true">Drag anywhere to draw. Draw <b>across the thing you want to hit</b>.</p>
    <p class="visually-hidden" id="announce" aria-live="polite"></p>
    <noscript><p style="padding: 24px; color: #fff">Wand needs JavaScript to run.</p></noscript>
  </body>
</html>
