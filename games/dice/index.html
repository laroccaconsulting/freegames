<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dice — Yacht and Ten Thousand, free, no ads</title>
    <meta name="description" content="Dice games with no ads: Yacht, the classic five-dice category game (with a daily dice challenge), and Ten Thousand, the push-your-luck game. Solo, versus the computer, or pass and play." />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dice" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="core/base.css" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="title-btn" id="mode-btn" aria-label="Choose game">
          <span class="title-main" id="title">Dice</span>
          <small class="title-sub" id="subtitle"></small>
        </button>
      </header>
      <main class="stage" id="stage"></main>
      <nav class="toolbar" aria-label="Game controls">
        <button class="tool" id="rules-btn"><span>Rules</span></button>
        <button class="tool" id="menu-btn"><span>Games</span></button>
      </nav>
    </div>
    <p class="visually-hidden" id="announce" aria-live="polite"></p>
    <noscript><p style="padding: 24px">Dice needs JavaScript to run.</p></noscript>
  </body>
</html>
